name: Daily A-share index PIT collection

on:
  schedule:
    # Every day at 16:30 China Standard Time (UTC+8); weekends/holidays may repeat the last source state.
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional candidate limit for a smoke run (blank means all)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-a-share-index-pit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout private data repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout public collector code
        uses: actions/checkout@v4
        with:
          repository: jack4leo/a-share-index-pit
          ref: main
          path: collector
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install collector dependencies
        run: python -m pip install -r collector/requirements.txt

      - name: Collect index observations
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          args=(--data-dir "$GITHUB_WORKSPACE/data" --workers 4)
          if [[ -n "$LIMIT" ]]; then args+=(--limit "$LIMIT"); fi
          PYTHONPATH="$GITHUB_WORKSPACE/collector/src" python -m a_share_index_pit.collector "${args[@]}"

      - name: Commit private observations and membership events
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "data: daily A-share index PIT observations"
            git push
          else
            echo "No data changes to commit."
          fi
